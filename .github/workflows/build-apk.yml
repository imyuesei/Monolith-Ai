name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk NotchEyes.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NotchEyes
          path: NotchEyes.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest NotchEyes.apk \
            --target "${{ github.sha }}" \
            --title "Notch Eyes (latest build)" \
            --notes "Built from ${{ github.sha }}. Download NotchEyes.apk below and install it on your Android phone (allow installs from unknown sources)."
